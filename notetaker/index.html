<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmur Meeting Notes</title>
  <meta name="description" content="Record conversations, get a live transcript with speakers and timestamps, and an automatic summary.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <a class="brand" href="#/">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="var(--accent)"/>
          <g fill="#fff"><rect x="7" y="13" width="3" height="6" rx="1.5"/><rect x="12" y="9" width="3" height="14" rx="1.5"/><rect x="17" y="6" width="3" height="20" rx="1.5"/><rect x="22" y="11" width="3" height="10" rx="1.5"/></g>
        </svg>
        <span>Murmur</span>
      </a>
      <a class="btn record-cta" href="#/record" id="newRecording">
        <span class="dot"></span> New recording
      </a>
      <label class="search">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearch" type="search" placeholder="Search all conversations" autocomplete="off">
      </label>
      <nav class="note-list" id="noteList"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost small" id="loadSample" type="button">Add a sample conversation</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Open conversation list">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
        <span class="topbar-title">Murmur</span>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
